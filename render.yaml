databases:
  # Keycloak POC database — Render's free tier, deleted 30 days after creation.
  # Separate from the probo application database on purpose; this is throwaway.
  - name: govrly-keycloak-db
    databaseName: keycloak
    user: keycloak
    plan: free
    region: frankfurt

services:
  - type: web
    name: probo
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: standard
    envVars:
      - key: PROBOD_BASE_URL
        value: https://Advance-Datasec.onrender.com
      - key: API_ADDR
        value: ":8080"
      - key: API_CORS_ALLOWED_ORIGINS
        value: "https://Advance-Datasec.onrender.com"
      - key: AUTH_COOKIE_DOMAIN
        value: "Advance-Datasec.onrender.com"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      # Allowlist of CIMD (Client ID Metadata Document) client_id URLs permitted
      # to authenticate via OAuth. Required for claude.ai's MCP connector.
      - key: PROBOD_OAUTH2_SERVER_CIMD_ALLOWED_CLIENT_IDS
        value: "https://claude.ai/oauth/mcp-oauth-client-metadata"
      - key: PG_ADDR
        sync: false
      - key: PG_USERNAME
        sync: false
      - key: PG_PASSWORD
        sync: false
      - key: PG_DATABASE
        sync: false
      - key: PG_POOL_SIZE
        value: "20"
      - key: CHROME_DP_ADDR
        fromService:
          name: chrome-headless
          type: pserv
          property: hostport
      - key: PROBOD_ENCRYPTION_KEY
        generateValue: true
      - key: AUTH_COOKIE_SECRET
        generateValue: true
      - key: AUTH_PASSWORD_PEPPER
        generateValue: true
      - key: TRUST_AUTH_TOKEN_SECRET
        generateValue: true
      - key: AWS_REGION
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_USE_PATH_STYLE
        value: "true"
      - key: METRICS_ADDR
        value: ""
      - key: TRACING_ADDR
        value: ""
      - key: SMTP_ADDR
        sync: false
      - key: SMTP_TLS_REQUIRED
        value: "true"

  - type: pserv
    name: chrome-headless
    runtime: image
    image:
      url: chromedp/headless-shell:140.0.7259.2
    plan: starter

  # ---------------------------------------------------------------------------
  # Keycloak 26 MFA / OIDC-IdP test deployment. Standalone from the probo stack:
  # its own image, its own database, no private-network link. See keycloak/README.md.
  # ---------------------------------------------------------------------------
  - type: web
    name: govrly-keycloak
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./keycloak/Dockerfile
    dockerContext: ./keycloak
    # Keycloak 26 serves /health on the *management* port (9000), which Render
    # cannot reach — only one port is routed. /realms/master is on the main port,
    # needs no auth, and only answers 200 once the DB is up and realms are loaded.
    healthCheckPath: /realms/master
    envVars:
      # --- database wiring (Render -> JDBC happens in keycloak/entrypoint.sh) ---
      - key: DB_HOST
        fromDatabase:
          name: govrly-keycloak-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: govrly-keycloak-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: govrly-keycloak-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: govrly-keycloak-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: govrly-keycloak-db
          property: password

      # --- bootstrap admin (temporary account, create a real one after login) ---
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true

      # --- HTTP / proxy: TLS terminates at Render's edge, Keycloak speaks plain
      # HTTP behind it and trusts X-Forwarded-* to rebuild the public URL. ---
      - key: KC_HTTP_ENABLED
        value: "true"
      - key: KC_HTTP_PORT
        value: "10000"
      - key: KC_PROXY_HEADERS
        value: xforwarded
      - key: KC_HEALTH_ENABLED
        value: "true"
