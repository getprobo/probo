name: "Release n8n node"

on:
  push:
    tags:
      - "@probo/n8n-nodes-probo/v*"

permissions:
  contents: "read"

jobs:
  publish:
    name: "publish"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
          scope: "@probo"
      - run: "npm install -g npm@^12.0.2"
      - run: "npm ci"
      - name: "Verify package.json version matches tag"
        run: |
          TAG_VERSION="${GITHUB_REF_NAME##*/v}"
          PKG_VERSION="$(node -p "require('./packages/n8n-node/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)" >&2
            exit 1
          fi
      - run: "npm --workspace @probo/n8n-nodes-probo run build"
      - uses: "anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610" # v0.24.0
        with:
          path: ./packages/n8n-node
          format: cyclonedx-json
          output-file: packages/n8n-node/sbom.json
      - uses: "anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2" # v7.4.0
        with:
          path: ./packages/n8n-node
          fail-build: true
          severity-cutoff: critical
      # Pack once and attest the tarball. dist/** exceeds GitHub's 1024-subject
      # attestation limit (n8n emits .js/.map/.d.ts per operation).
      - name: "Pack package and generate checksums"
        working-directory: "packages/n8n-node"
        run: |
          PACKFILE=$(npm pack --silent)
          echo "PACKFILE=$PACKFILE" >> "$GITHUB_ENV"
          tar -tzf "$PACKFILE" \
            | grep -v '/$' \
            | sort \
            | while read -r file; do
                hash=$(tar -xOf "$PACKFILE" "$file" | sha256sum | head -c 64)
                echo "$hash  $file"
              done > checksums.txt
          test -s checksums.txt
          test -f "$PACKFILE"
      - run: 'npm publish "packages/n8n-node/${PACKFILE}" --access public --dry-run'
      - uses: "actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e" # v4
        with:
          subject-path: "packages/n8n-node/${{ env.PACKFILE }}"
          sbom-path: "packages/n8n-node/sbom.json"
      - uses: "actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373" # v4
        with:
          subject-path: "packages/n8n-node/${{ env.PACKFILE }}"
      - name: "Publish to npm"
        run: |
          PKG_VERSION="$(node -p "require('./packages/n8n-node/package.json').version")"
          if npm view "@probo/n8n-nodes-probo@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "Version ${PKG_VERSION} already on npm; skipping publish"
          else
            npm publish "packages/n8n-node/${PACKFILE}" --access public
          fi
      - name: "Extract release notes"
        run: |
          VERSION="${GITHUB_REF_NAME##*/v}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if ($0 ~ "\\[" ver "\\]") found=1 }
            found
          ' packages/n8n-node/CHANGELOG.md > release-notes.md
      - name: "Create GitHub release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if echo "${GITHUB_REF_NAME}" | grep -qE '(alpha|beta|rc)'; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release delete "${GITHUB_REF_NAME}" --yes 2>/dev/null || true

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            $PRERELEASE_FLAG \
            "packages/n8n-node/${PACKFILE}" \
            packages/n8n-node/sbom.json \
            packages/n8n-node/checksums.txt
      - uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7
        with:
          name: "npm-sbom"
          path: |
            packages/n8n-node/${{ env.PACKFILE }}
            packages/n8n-node/sbom.json
            packages/n8n-node/checksums.txt
          retention-days: 30
