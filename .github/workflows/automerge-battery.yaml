name: "automerge benchmark battery"

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: "read"

jobs:
  official-fast-tier:
    name: "official fast tier"
    runs-on: "runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/extras=s3-cache"
    timeout-minutes: 30
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v6
      - uses: "runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3" # v2
      - uses: "./.github/actions/setup"
        with:
          node: "false"
      - name: "Run pinned upstream battery"
        run: |
          make benchmark-automerge-official \
            AUTOMERGE_BATTERY_OUTPUT="${RUNNER_TEMP}/automerge-battery.json"
      - name: "Replay official battery fixtures through Go and Rust"
        run: |
          make test-automerge-official-fixtures \
            AUTOMERGE_BATTERY_FIXTURES="${RUNNER_TEMP}/automerge-battery-fixtures"
      - uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7
        with:
          name: "automerge-battery-${{ github.sha }}"
          path: "${{ runner.temp }}/automerge-battery.json"
          if-no-files-found: "error"
          retention-days: 30
