name: "Release probo-agent"

on:
  push:
    tags:
      - "probo-agent/v*"

permissions:
  contents: "read"

jobs:
  build-binary:
    name: "binary (${{ matrix.goos }}/${{ matrix.goarch }})"
    runs-on: "runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/extras=s3-cache"
    permissions:
      contents: "read"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: freebsd, goarch: arm64 }
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v6
        with:
          submodules: recursive
      - uses: "runs-on/action@4e5f72399b6b17f2e79c511c1b38a315a64d22dc" # v2
      - uses: "./.github/actions/setup"
        with:
          node: "false"
      - name: "Build binary"
        env:
          CGO_ENABLED: "0"
          GOOS: "${{ matrix.goos }}"
          GOARCH: "${{ matrix.goarch }}"
        run: |
          VERSION="${GITHUB_REF_NAME##*/v}"

          go build -ldflags "-s -w -X 'main.version=${VERSION}'" \
            -gcflags="-e" -o "dist/probo-agent" ./cmd/probo-agent
      - name: "Create archive"
        env:
          GOOS: "${{ matrix.goos }}"
          GOARCH: "${{ matrix.goarch }}"
        run: |
          case "$GOOS" in
            linux)   OS="Linux" ;;
            freebsd) OS="Freebsd" ;;
          esac
          case "$GOARCH" in
            amd64) ARCH="x86_64" ;;
            *)     ARCH="$GOARCH" ;;
          esac

          mkdir -p archives
          AGENT_DIR="probo-agent_${OS}_${ARCH}"
          mkdir -p "staging/${AGENT_DIR}"
          cp "dist/probo-agent" README.md LICENSE "staging/${AGENT_DIR}/"
          if [ -f cmd/probo-agent/CHANGELOG.md ]; then
            cp cmd/probo-agent/CHANGELOG.md "staging/${AGENT_DIR}/"
          fi
          tar -czf "archives/${AGENT_DIR}.tar.gz" -C staging "${AGENT_DIR}"
      - uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7
        with:
          name: "archive-${{ matrix.goos }}-${{ matrix.goarch }}"
          path: "archives/"
          retention-days: 1

  build-windows:
    name: "windows (${{ matrix.goarch }})"
    runs-on: "windows-latest"
    environment: "probo-agent-release"
    permissions:
      contents: "read"
      id-token: "write"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: amd64, arch_label: x86_64, wix_arch: amd64 }
          - { goarch: arm64, arch_label: arm64, wix_arch: arm64 }
    steps:
      - uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v6
        with:
          submodules: recursive
      - uses: "./.github/actions/setup"
        with:
          node: "false"
      - name: "Install WiX"
        shell: "pwsh"
        run: |
          dotnet tool install --global wix --version 6.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" --version
      - name: "Build binary"
        shell: "pwsh"
        env:
          CGO_ENABLED: "0"
          GOOS: "windows"
          GOARCH: "${{ matrix.goarch }}"
        run: |
          $ErrorActionPreference = "Stop"
          $Version = $env:GITHUB_REF_NAME -replace '^.*\/v', ''
          New-Item -ItemType Directory -Force -Path dist, archives | Out-Null
          $ldflags = "-s -w -X 'main.version=$Version'"
          go build -ldflags $ldflags -gcflags="-e" -o dist/probo-agent.exe ./cmd/probo-agent
          if ($LASTEXITCODE -ne 0) { throw "go build failed" }
      - name: "Azure login"
        uses: "azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43" # v3.0.0
        with:
          client-id: "${{ secrets.AZURE_CLIENT_ID }}"
          tenant-id: "${{ secrets.AZURE_TENANT_ID }}"
          subscription-id: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
      - name: "Sign probo-agent.exe"
        uses: "azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82" # v2.0.0
        with:
          endpoint: "${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}"
          signing-account-name: "${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}"
          certificate-profile-name: "${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}"
          files: "${{ github.workspace }}/dist/probo-agent.exe"
          file-digest: "SHA256"
          timestamp-rfc3161: "http://timestamp.acs.microsoft.com"
          timestamp-digest: "SHA256"
          description: "Probo Agent"
          description-url: "https://probo.com"
      - name: "Build MSI"
        id: "msi"
        shell: "pwsh"
        run: |
          $ErrorActionPreference = "Stop"
          $Version = $env:GITHUB_REF_NAME -replace '^.*\/v', ''
          $ArchLabel = "${{ matrix.arch_label }}"
          New-Item -ItemType Directory -Force -Path archives | Out-Null
          $Msi = Join-Path $PWD "archives/probo-agent_${Version}_windows_${ArchLabel}.msi"
          & ./cmd/probo-agent/installer/windows/build.ps1 `
            -Binary ./dist/probo-agent.exe `
            -Version $Version `
            -Arch "${{ matrix.wix_arch }}" `
            -Output $Msi
          "msi_path=$Msi" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: "Sign MSI"
        uses: "azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82" # v2.0.0
        with:
          endpoint: "${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}"
          signing-account-name: "${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}"
          certificate-profile-name: "${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}"
          files: "${{ steps.msi.outputs.msi_path }}"
          file-digest: "SHA256"
          timestamp-rfc3161: "http://timestamp.acs.microsoft.com"
          timestamp-digest: "SHA256"
          description: "Probo Agent"
          description-url: "https://probo.com"
      - name: "Create zip archive"
        shell: "pwsh"
        run: |
          $ErrorActionPreference = "Stop"
          $ArchLabel = "${{ matrix.arch_label }}"
          $AgentDir = "probo-agent_Windows_$ArchLabel"
          $StagingRoot = Join-Path $PWD "staging"
          $Staging = Join-Path $StagingRoot $AgentDir
          New-Item -ItemType Directory -Force -Path $Staging, archives | Out-Null
          Copy-Item dist/probo-agent.exe $Staging/
          Copy-Item README.md, LICENSE $Staging/
          if (Test-Path cmd/probo-agent/CHANGELOG.md) {
            Copy-Item cmd/probo-agent/CHANGELOG.md $Staging/
          }
          $Zip = Join-Path $PWD "archives/$AgentDir.zip"
          if (Test-Path $Zip) { Remove-Item $Zip }
          # Prefer tar so zip entry paths use forward slashes (Go updater
          # matches with path.Clean, not filepath).
          & tar.exe -a -c -f $Zip -C $StagingRoot $AgentDir
          if ($LASTEXITCODE -ne 0) { throw "tar zip failed" }
      - uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7
        with:
          name: "archive-windows-${{ matrix.goarch }}"
          path: "archives/"
          retention-days: 1

  build-macos:
    name: "macos (darwin pkg + darwin archives)"
    runs-on: "macos-26"
    permissions:
      contents: "read"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v6
        with:
          submodules: recursive
      - uses: "./.github/actions/setup"
        with:
          node: "false"
      - name: "Select Xcode version"
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcode-select -p
          swift --version
      - name: "Import signing certificate"
        env:
          CERTIFICATE_BASE64: "${{ secrets.APPLE_CERTIFICATE }}"
          CERTIFICATE_PASSWORD: "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
          KEYCHAIN_PASSWORD: "${{ secrets.KEYCHAIN_PASSWORD }}"
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm certificate.p12
      - name: "Build CGO darwin binaries and darwin pkg"
        env:
          CGO_ENABLED: "1"
          CODESIGN_IDENTITY: "${{ secrets.CODESIGN_IDENTITY }}"
          INSTALLER_IDENTITY: "${{ secrets.INSTALLER_IDENTITY }}"
          APPLE_ID: "${{ secrets.APPLE_ID }}"
          APPLE_ID_PASSWORD: "${{ secrets.APPLE_ID_PASSWORD }}"
          APPLE_TEAM_ID: "${{ secrets.APPLE_TEAM_ID }}"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME##*/v}"
          LDFLAGS="-s -w -X 'main.version=${VERSION}'"

          mkdir -p dist archives staging
          export COPYFILE_DISABLE=1

          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" \
            -gcflags="-e" -o dist/probo-agent_arm64 ./cmd/probo-agent
          GOOS=darwin GOARCH=amd64 go build -ldflags "${LDFLAGS}" \
            -gcflags="-e" -o dist/probo-agent_amd64 ./cmd/probo-agent

          lipo -create \
            dist/probo-agent_arm64 \
            dist/probo-agent_amd64 \
            -output dist/probo-agent_universal

          for pair in "arm64:arm64" "amd64:x86_64"; do
            GOARCH="${pair%%:*}"
            ARCH="${pair##*:}"
            AGENT_DIR="probo-agent_Darwin_${ARCH}"
            mkdir -p "staging/${AGENT_DIR}"
            cp "dist/probo-agent_${GOARCH}" "staging/${AGENT_DIR}/probo-agent"
            cp README.md LICENSE "staging/${AGENT_DIR}/"
            if [ -f cmd/probo-agent/CHANGELOG.md ]; then
              cp cmd/probo-agent/CHANGELOG.md "staging/${AGENT_DIR}/"
            fi
            # Match the PKG payload signing identity so auto-update does
            # not replace a Developer ID binary with an ad-hoc one (which
            # multiplies macOS Background Activity entries).
            codesign --force --options runtime --timestamp \
              --identifier com.probo.agent \
              --sign "${CODESIGN_IDENTITY}" "staging/${AGENT_DIR}/probo-agent"
            codesign --verify --verbose=2 "staging/${AGENT_DIR}/probo-agent"
            tar -czf "archives/${AGENT_DIR}.tar.gz" -C staging "${AGENT_DIR}"
          done

          chmod +x cmd/probo-agent/installer/macos/build.sh \
            cmd/probo-agent/installer/macos/scripts/preinstall \
            cmd/probo-agent/installer/macos/scripts/postinstall

          cmd/probo-agent/installer/macos/build.sh \
            --binary dist/probo-agent_universal \
            --version "${VERSION}" \
            --output "archives/probo-agent_${VERSION}_darwin.pkg"
      - uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7
        with:
          name: "archive-darwin"
          path: "archives/"
          retention-days: 1

  github-release:
    name: "github-release"
    needs: [build-binary, build-windows, build-macos]
    runs-on: "runs-on=${{ github.run_id }}/runner=2cpu-linux-x64/extras=s3-cache"
    permissions:
      contents: "write"
      id-token: "write"
      attestations: "write"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v6
        with:
          fetch-depth: 0
      - uses: "runs-on/action@4e5f72399b6b17f2e79c511c1b38a315a64d22dc" # v2
      - uses: "sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6" # v4.1.2
      - uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8
        with:
          pattern: "archive-*"
          path: "archives"
          merge-multiple: true
      - name: "Generate checksums and sign"
        run: |
          cd archives
          sha256sum *.tar.gz *.zip *.pkg *.msi > checksums.txt
          cosign sign-blob --bundle="checksums.txt.bundle" checksums.txt --yes
      - name: "Inject release checksums into install.sh"
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp cmd/probo-agent/installer/install.sh archives/install.sh
          sed -i "s|^RELEASE_TAG=\"__PROBO_AGENT_RELEASE_TAG__\"|RELEASE_TAG=\"${TAG}\"|" archives/install.sh
          grep 'probo-agent_.*\.tar\.gz' archives/checksums.txt > archives/probo-agent-checksums.txt
          awk '
            /# __PROBO_AGENT_CHECKSUMS_BEGIN__/ {
              print
              while ((getline line < "archives/probo-agent-checksums.txt") > 0) print line
              skip = 1
              next
            }
            /# __PROBO_AGENT_CHECKSUMS_END__/ {
              skip = 0
              print
              next
            }
            !skip { print }
            END {
              if (skip) {
                print "install.sh injection failed: missing # __PROBO_AGENT_CHECKSUMS_END__ marker" > "/dev/stderr"
                exit 1
              }
            }
          ' archives/install.sh > archives/install.sh.tmp
          mv archives/install.sh.tmp archives/install.sh
      - name: "Generate SBOM"
        uses: "anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610" # v0.24.0
        with:
          path: ./cmd/probo-agent
          format: cyclonedx-json
          output-file: sbom.json
      - name: "Run vulnerability scan"
        uses: "anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2" # v7.4.0
        with:
          sbom: "sbom.json"
          fail-build: true
          severity-cutoff: critical
      - name: "Attest SBOM for archives"
        uses: "actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e" # v4
        with:
          subject-path: "archives/*.tar.gz, archives/*.zip, archives/*.pkg, archives/*.msi"
          sbom-path: "sbom.json"
      - name: "Attest build provenance for archives"
        uses: "actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373" # v4
        with:
          subject-path: "archives/*.tar.gz, archives/*.zip, archives/*.pkg, archives/*.msi"
      - name: "Extract release notes"
        run: |
          VERSION="${GITHUB_REF_NAME##*/v}"
          if [ -f cmd/probo-agent/CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              /^## \[/ { if (found) exit; if ($0 ~ "\\[" ver "\\]") found=1 }
              found
            ' cmd/probo-agent/CHANGELOG.md > release-notes.md
          else
            echo "probo-agent ${VERSION}" > release-notes.md
          fi
      - name: "Create GitHub release"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          PRERELEASE_FLAG=""
          if echo "${GITHUB_REF_NAME}" | grep -qE '(alpha|beta|rc)'; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release delete "${GITHUB_REF_NAME}" --yes 2>/dev/null || true

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            $PRERELEASE_FLAG \
            archives/* sbom.json
      - uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7
        with:
          name: "sbom"
          path: "sbom.json"
          retention-days: 30
