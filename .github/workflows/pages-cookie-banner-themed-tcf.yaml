name: "Pages cookie-banner-themed-tcf"

on:
  push:
    branches:
      - "main"
    paths:
      - "examples/cookie-banner/themed-tcf/**"
      - "examples/cookie-banner/shared/**"
      - "examples/cookie-banner/vite.shared.ts"
      - "packages/cookie-banner/src/**"
      - "packages/cookie-banner/package.json"
      - "packages/cookie-banner/build.mjs"
      - "packages/cookie-banner/tsconfig.json"
      - "packages/cookie-banner-tcf/src/**"
      - "packages/cookie-banner-tcf/package.json"
      - "packages/cookie-banner-tcf/build.mjs"
      - "packages/cookie-banner-tcf/tsconfig.json"
      - ".nvmrc"
      - ".github/workflows/pages-cookie-banner-themed-tcf.yaml"
  workflow_dispatch:

permissions:
  contents: "read"
  pages: "write"
  id-token: "write"

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: "build"
    runs-on: "ubuntu-latest"
    environment: "cookie-banner-example-pages"
    steps:
      - uses: "actions/checkout@v7.0.1"
        with:
          fetch-depth: 0
          submodules: recursive
      - name: "Require baked banner config"
        env:
          PUBLIC_COOKIE_BANNER_ID: "${{ secrets.PUBLIC_COOKIE_BANNER_ID }}"
          PUBLIC_COOKIE_BANNER_API_BASE_URL: "${{ secrets.PUBLIC_COOKIE_BANNER_API_BASE_URL }}"
        run: |
          if [ -z "$PUBLIC_COOKIE_BANNER_ID" ]; then
            echo "PUBLIC_COOKIE_BANNER_ID must be set on the cookie-banner-example-pages environment" >&2
            exit 1
          fi
          case "$PUBLIC_COOKIE_BANNER_API_BASE_URL" in
            http://?*|https://?*) ;;
            *)
              echo "PUBLIC_COOKIE_BANNER_API_BASE_URL must be an http or https URL" >&2
              exit 1
              ;;
          esac
      - uses: "actions/setup-node@v7.1.0"
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: "npm install -g npm@^12.0.2"
      - run: "npm ci"
      - run: "npm --workspace @probo/cookie-banner run build"
      - run: "npm --workspace @probo/cookie-banner-tcf run build"
      - run: "npm --workspace @probo/example-cookie-banner-themed-tcf run build"
        env:
          PUBLIC_COOKIE_BANNER_ID: "${{ secrets.PUBLIC_COOKIE_BANNER_ID }}"
          PUBLIC_COOKIE_BANNER_API_BASE_URL: "${{ secrets.PUBLIC_COOKIE_BANNER_API_BASE_URL }}"
      - run: "touch examples/cookie-banner/themed-tcf/dist/.nojekyll"
      - uses: "actions/upload-pages-artifact@v5.0.0"
        with:
          path: "examples/cookie-banner/themed-tcf/dist"
          include-hidden-files: true

  deploy:
    name: "deploy"
    needs: "build"
    runs-on: "ubuntu-latest"
    environment:
      name: "github-pages"
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - id: "deployment"
        uses: "actions/deploy-pages@v5.0.1"
