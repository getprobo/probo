# Keeps the ja-JP catalogs in sync with en-US. Fails when upstream adds keys
# that have no Japanese translation yet, or when a translation drops a
# {{variable}}, $t() reference or <tag>.
name: "i18n-check"
on:
  push:
    branches:
      - "main"
      - "i18n/**"
  pull_request:
    paths:
      - "apps/*/src/**/_locales/*.json"
      - "apps/console/public/data/frameworks/**"
      - "scripts/i18n/**"
      - ".github/workflows/i18n-check.yaml"

permissions:
  contents: "read"

jobs:
  check:
    name: "check ja-JP catalogs"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v6
        with:
          persist-credentials: false
      - uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v6
        with:
          node-version-file: ".nvmrc"
      - name: "Test checkers"
        run: "node --test scripts/i18n/check-locales.test.mjs scripts/i18n/check-frameworks.test.mjs"
      - name: "Check ja-JP catalogs"
        run: "node scripts/i18n/check-locales.mjs --locale ja-JP"
      - name: "Check ja-JP frameworks"
        run: "node scripts/i18n/check-frameworks.mjs --locale ja-JP"
