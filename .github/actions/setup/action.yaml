name: "Setup"
description: "Set up Go and/or Node.js toolchains"
inputs:
  go:
    description: "Set up Go toolchain and download modules"
    required: false
    default: "true"
  node:
    description: "Set up Node.js and install dependencies"
    required: false
    default: "true"
  go-cache-key-prefix:
    description: "Prefix for the Go cache key so parallel jobs do not share a blob"
    required: false
    default: "${{ github.workflow }}-${{ github.job }}"
runs:
  using: "composite"
  steps:
    - if: inputs.go == 'true'
      uses: "./.github/actions/setup-go"
      with:
        go-version: "1.27.1"
        cache-key-prefix: "${{ inputs.go-cache-key-prefix }}"
    - if: inputs.go == 'true'
      shell: bash
      run: go mod download
    - if: inputs.node == 'true'
      uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38" # v6
      with:
        node-version-file: ".nvmrc"
        cache: "npm"
    - if: inputs.node == 'true'
      shell: bash
      run: npm install -g npm@^12.0.2
    - if: inputs.node == 'true'
      shell: bash
      run: npm ci
