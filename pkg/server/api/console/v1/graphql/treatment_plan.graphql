enum TreatmentPlanOrderField
    @goModel(
        model: "go.probo.inc/probo/pkg/coredata.TreatmentPlanOrderField"
    ) {
    CREATED_AT
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.TreatmentPlanOrderFieldCreatedAt"
        )
    TREATMENT
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.TreatmentPlanOrderFieldTreatment"
        )
    INHERENT_RISK_SCORE
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.TreatmentPlanOrderFieldInherentRiskScore"
        )
    RESIDUAL_RISK_SCORE
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.TreatmentPlanOrderFieldResidualRiskScore"
        )
}

input TreatmentPlanOrder
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.TreatmentPlanOrderBy"
    ) {
    direction: OrderDirection!
    field: TreatmentPlanOrderField!
}

type TreatmentPlan implements Node {
    id: ID!
    treatment: RiskTreatment!
    inherentLikelihood: Int!
    inherentImpact: Int!
    inherentRiskScore: Int!
    residualLikelihood: Int!
    residualImpact: Int!
    residualRiskScore: Int!
    netLikelihood: Int! @goField(forceResolver: true)
    netImpact: Int! @goField(forceResolver: true)
    netRiskScore: Int! @goField(forceResolver: true)

    owner: Profile! @goField(forceResolver: true)
    risk: Risk! @goField(forceResolver: true)
    riskAnalysis: RiskAnalysis! @goField(forceResolver: true)
    organization: Organization! @goField(forceResolver: true)

    measures(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: MeasureOrder
        filter: MeasureFilter
    ): MeasureConnection! @goField(forceResolver: true)

    createdAt: Datetime!
    updatedAt: Datetime!

    permission(action: String!): Boolean! @goField(forceResolver: true)
}

type TreatmentPlanConnection
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.TreatmentPlanConnection"
    ) {
    totalCount: Int! @goField(forceResolver: true)
    edges: [TreatmentPlanEdge!]!
    pageInfo: PageInfo!
}

type TreatmentPlanEdge {
    cursor: CursorKey!
    node: TreatmentPlan!
}

extend type Mutation {
    createTreatmentPlan(
        input: CreateTreatmentPlanInput!
    ): CreateTreatmentPlanPayload!
    updateTreatmentPlan(
        input: UpdateTreatmentPlanInput!
    ): UpdateTreatmentPlanPayload!
    deleteTreatmentPlan(
        input: DeleteTreatmentPlanInput!
    ): DeleteTreatmentPlanPayload!
    createTreatmentPlanMeasureMapping(
        input: CreateTreatmentPlanMeasureMappingInput!
    ): CreateTreatmentPlanMeasureMappingPayload!
    deleteTreatmentPlanMeasureMapping(
        input: DeleteTreatmentPlanMeasureMappingInput!
    ): DeleteTreatmentPlanMeasureMappingPayload!
}

input CreateTreatmentPlanInput {
    riskId: ID!
    riskAnalysisId: ID!
    treatment: RiskTreatment!
    ownerId: ID!
    inherentLikelihood: Int!
    inherentImpact: Int!
    residualLikelihood: Int
    residualImpact: Int
}

input UpdateTreatmentPlanInput {
    id: ID!
    treatment: RiskTreatment
    ownerId: ID @goField(omittable: true)
    inherentLikelihood: Int
    inherentImpact: Int
    residualLikelihood: Int
    residualImpact: Int
}

input DeleteTreatmentPlanInput {
    treatmentPlanId: ID!
}

input CreateTreatmentPlanMeasureMappingInput {
    treatmentPlanId: ID!
    measureId: ID!
}

input DeleteTreatmentPlanMeasureMappingInput {
    treatmentPlanId: ID!
    measureId: ID!
}

type CreateTreatmentPlanPayload {
    treatmentPlanEdge: TreatmentPlanEdge!
}

type UpdateTreatmentPlanPayload {
    treatmentPlan: TreatmentPlan!
}

type DeleteTreatmentPlanPayload {
    deletedTreatmentPlanId: ID!
}

type CreateTreatmentPlanMeasureMappingPayload {
    treatmentPlanEdge: TreatmentPlanEdge!
    measureEdge: MeasureEdge!
}

type DeleteTreatmentPlanMeasureMappingPayload {
    deletedTreatmentPlanId: ID!
    deletedMeasureId: ID!
    treatmentPlan: TreatmentPlan!
}
