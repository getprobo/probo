enum TagOrderField
    @goModel(model: "go.probo.inc/probo/pkg/coredata.TagOrderField") {
    CREATED_AT
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.TagOrderFieldCreatedAt"
        )
    KEY
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.TagOrderFieldKey"
        )
}

input TagOrder
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.TagOrderBy"
    ) {
    direction: OrderDirection!
    field: TagOrderField!
}

type Tag implements Node {
    id: ID!
    organization: Organization! @goField(forceResolver: true)
    key: String!
    value: String!
    color: String
    createdAt: Datetime!
    updatedAt: Datetime!

    assignments(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: TagAssignmentOrder
    ): TagAssignmentConnection! @goField(forceResolver: true)

    permission(action: String!): Boolean! @goField(forceResolver: true)
}

enum TagAssignmentOrderField
    @goModel(
        model: "go.probo.inc/probo/pkg/coredata.TagAssignmentOrderField"
    ) {
    CREATED_AT
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.TagAssignmentOrderFieldCreatedAt"
        )
}

input TagAssignmentOrder
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.TagAssignmentOrderBy"
    ) {
    direction: OrderDirection!
    field: TagAssignmentOrderField!
}

type TagAssignment
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.TagAssignment"
    ) {
    id: ID!
    resource: Node @goField(forceResolver: true)
    createdAt: Datetime!
}

type TagAssignmentConnection
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.TagAssignmentConnection"
    ) {
    edges: [TagAssignmentEdge!]!
    pageInfo: PageInfo!
    totalCount: Int! @goField(forceResolver: true)
}

type TagAssignmentEdge {
    cursor: CursorKey!
    node: TagAssignment!
}

type TagConnection
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.TagConnection"
    ) {
    edges: [TagEdge!]!
    pageInfo: PageInfo!
    totalCount: Int! @goField(forceResolver: true)
}

type TagEdge {
    cursor: CursorKey!
    node: Tag!
}

extend type Organization {
    tags(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: TagOrder
    ): TagConnection! @goField(forceResolver: true)
}

extend type Query {
    tagsForResource(resourceId: ID!): [Tag!]!
}

extend type Mutation {
    createTag(
        input: CreateTagInput!
    ): CreateTagPayload!
    updateTag(
        input: UpdateTagInput!
    ): UpdateTagPayload!
    deleteTag(
        input: DeleteTagInput!
    ): DeleteTagPayload!
    attachTag(
        input: AttachTagInput!
    ): AttachTagPayload!
    detachTag(
        input: DetachTagInput!
    ): DetachTagPayload!
}

input CreateTagInput {
    organizationId: ID!
    key: String!
    value: String!
    color: String
}

input UpdateTagInput {
    id: ID!
    key: String
    value: String
    color: String @goField(omittable: true)
}

input DeleteTagInput {
    tagId: ID!
}

input AttachTagInput {
    resourceId: ID!
    tagId: ID!
}

input DetachTagInput {
    resourceId: ID!
    tagId: ID!
}

type CreateTagPayload {
    tagEdge: TagEdge!
}

type UpdateTagPayload {
    tag: Tag!
}

type DeleteTagPayload {
    deletedTagId: ID!
}

type AttachTagPayload {
    tag: Tag!
    tagAssignmentEdge: TagAssignmentEdge!
    replacedTagAssignmentId: ID
}

type DetachTagPayload {
    tag: Tag!
    deletedTagAssignmentId: ID
}
