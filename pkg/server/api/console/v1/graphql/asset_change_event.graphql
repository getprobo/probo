enum AssetChangeType
    @goModel(model: "go.probo.inc/probo/pkg/coredata.AssetChangeType") {
    CREATED
        @goEnum(value: "go.probo.inc/probo/pkg/coredata.AssetChangeTypeCreated")
    UPDATED
        @goEnum(value: "go.probo.inc/probo/pkg/coredata.AssetChangeTypeUpdated")
    DEACTIVATED
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.AssetChangeTypeDeactivated"
        )
}

enum AssetChangeEventOrderField
    @goModel(model: "go.probo.inc/probo/pkg/coredata.AssetChangeEventOrderField") {
    OBSERVED_AT
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.AssetChangeEventOrderFieldObservedAt"
        )
}

input AssetChangeEventOrder
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.AssetChangeEventOrderBy"
    ) {
    direction: OrderDirection!
    field: AssetChangeEventOrderField!
}

type AssetChangeEvent implements Node
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.AssetChangeEvent"
    ) {
    id: ID!
    observedAt: Datetime!
    assetSyncId: ID
    actor: Profile @goField(forceResolver: true)
    changeType: AssetChangeType!
    before: String
    after: String
    permission(action: String!): Boolean! @goField(forceResolver: true)
}

type AssetChangeEventConnection
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.AssetChangeEventConnection"
    ) {
    totalCount: Int! @goField(forceResolver: true)
    edges: [AssetChangeEventEdge!]!
    pageInfo: PageInfo!
}

type AssetChangeEventEdge
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.AssetChangeEventEdge"
    ) {
    cursor: CursorKey!
    node: AssetChangeEvent!
}
