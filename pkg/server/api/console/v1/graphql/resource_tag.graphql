enum ResourceTagOrderField
    @goModel(model: "go.probo.inc/probo/pkg/coredata.ResourceTagOrderField") {
    CREATED_AT
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.ResourceTagOrderFieldCreatedAt"
        )
    KEY
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.ResourceTagOrderFieldKey"
        )
}

input ResourceTagOrder
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.ResourceTagOrderBy"
    ) {
    direction: OrderDirection!
    field: ResourceTagOrderField!
}

type ResourceTag implements Node {
    id: ID!
    organization: Organization! @goField(forceResolver: true)
    key: String!
    value: String!
    color: String
    createdAt: Datetime!
    updatedAt: Datetime!

    resourceIds: [ID!]! @goField(forceResolver: true)

    permission(action: String!): Boolean! @goField(forceResolver: true)
}

type ResourceTagConnection
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.ResourceTagConnection"
    ) {
    edges: [ResourceTagEdge!]!
    pageInfo: PageInfo!
    totalCount: Int! @goField(forceResolver: true)
}

type ResourceTagEdge {
    cursor: CursorKey!
    node: ResourceTag!
}

extend type Organization {
    resourceTags(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: ResourceTagOrder
    ): ResourceTagConnection! @goField(forceResolver: true)
}

extend type Query {
    resourceTagsForResource(resourceId: ID!): [ResourceTag!]!
}

extend type Mutation {
    createResourceTag(
        input: CreateResourceTagInput!
    ): CreateResourceTagPayload!
    updateResourceTag(
        input: UpdateResourceTagInput!
    ): UpdateResourceTagPayload!
    deleteResourceTag(
        input: DeleteResourceTagInput!
    ): DeleteResourceTagPayload!
    attachResourceTag(
        input: AttachResourceTagInput!
    ): AttachResourceTagPayload!
    detachResourceTag(
        input: DetachResourceTagInput!
    ): DetachResourceTagPayload!
}

input CreateResourceTagInput {
    organizationId: ID!
    key: String!
    value: String!
    color: String
}

input UpdateResourceTagInput {
    id: ID!
    key: String
    value: String
    color: String
}

input DeleteResourceTagInput {
    resourceTagId: ID!
}

input AttachResourceTagInput {
    resourceId: ID!
    tagId: ID!
}

input DetachResourceTagInput {
    resourceId: ID!
    tagId: ID!
}

type CreateResourceTagPayload {
    resourceTagEdge: ResourceTagEdge!
}

type UpdateResourceTagPayload {
    resourceTag: ResourceTag!
}

type DeleteResourceTagPayload {
    deletedResourceTagId: ID!
}

type AttachResourceTagPayload {
    resourceId: ID!
    tagId: ID!
}

type DetachResourceTagPayload {
    resourceId: ID!
    tagId: ID!
}
