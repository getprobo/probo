# Types

type RiskAnalysis implements Node {
    id: ID!
    name: String!
    description: String
    period: Period
    matrixSize: MatrixSize!
    organization: Organization @goField(forceResolver: true)

    treatmentPlans(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: TreatmentPlanOrder
    ): TreatmentPlanConnection! @goField(forceResolver: true)

    scenarioRisks(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: RiskOrder
    ): RiskConnection! @goField(forceResolver: true)

    diagrams(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: RiskAnalysisDiagramOrder
    ): RiskAnalysisDiagramConnection @goField(forceResolver: true)

    createdAt: Datetime!
    updatedAt: Datetime!
    permission(action: String!): Boolean! @goField(forceResolver: true)
}

type RiskAnalysisDiagram implements Node {
    id: ID!
    riskAnalysisId: ID!
    name: String!

    nodes(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: RiskAnalysisNodeOrder
    ): RiskAnalysisNodeConnection @goField(forceResolver: true)

    boundaries(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: RiskAnalysisBoundaryOrder
    ): RiskAnalysisBoundaryConnection @goField(forceResolver: true)

    processes(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: RiskAnalysisProcessOrder
    ): RiskAnalysisProcessConnection @goField(forceResolver: true)

    threats(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: RiskAnalysisThreatOrder
    ): RiskAnalysisThreatConnection @goField(forceResolver: true)

    scenarios(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: RiskAnalysisScenarioOrder
    ): RiskAnalysisScenarioConnection @goField(forceResolver: true)

    mermaidChart: String! @goField(forceResolver: true)

    createdAt: Datetime!
    updatedAt: Datetime!
}

type RiskAnalysisNode implements Node {
    id: ID!
    riskAnalysisDiagramId: ID!
    boundaryId: ID
    nodeType: RiskAnalysisNodeType!
    name: String!
    createdAt: Datetime!
    updatedAt: Datetime!
}

type RiskAnalysisBoundary implements Node {
    id: ID!
    riskAnalysisDiagramId: ID!
    parentBoundaryId: ID
    name: String!
    createdAt: Datetime!
    updatedAt: Datetime!
}

type RiskAnalysisProcess implements Node {
    id: ID!
    riskAnalysisDiagramId: ID!
    sourceNodeId: ID!
    targetNodeId: ID!
    name: String!
    createdAt: Datetime!
    updatedAt: Datetime!
}

type RiskAnalysisThreat implements Node {
    id: ID!
    riskAnalysisDiagramId: ID!
    processId: ID!
    name: String!
    category: String!
    createdAt: Datetime!
    updatedAt: Datetime!
}

type RiskAnalysisScenario implements Node {
    id: ID!
    riskAnalysisDiagramId: ID!
    diagram: RiskAnalysisDiagram @goField(forceResolver: true)
    name: String!
    description: String

    threats(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: RiskAnalysisThreatOrder
    ): RiskAnalysisThreatConnection @goField(forceResolver: true)

    risks(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: RiskOrder
    ): RiskConnection @goField(forceResolver: true)

    createdAt: Datetime!
    updatedAt: Datetime!
}

