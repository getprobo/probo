type OrganizationContext {
    organizationId: ID!
    product: String
    architecture: String
    team: String
    processes: String
    customers: String
}

enum ProfileState
  @goModel(model: "go.probo.inc/probo/pkg/coredata.ProfileState") {
  PENDING @goEnum(value: "go.probo.inc/probo/pkg/coredata.ProfileStatePending")
  ACTIVE @goEnum(value: "go.probo.inc/probo/pkg/coredata.ProfileStateActive")
  DEACTIVATED
    @goEnum(value: "go.probo.inc/probo/pkg/coredata.ProfileStateDeactivated")
}

enum MembershipRole
  @goModel(model: "go.probo.inc/probo/pkg/coredata.MembershipRole") {
  OWNER @goEnum(value: "go.probo.inc/probo/pkg/coredata.MembershipRoleOwner")
  ADMIN @goEnum(value: "go.probo.inc/probo/pkg/coredata.MembershipRoleAdmin")
  EMPLOYEE
    @goEnum(value: "go.probo.inc/probo/pkg/coredata.MembershipRoleEmployee")
  VIEWER @goEnum(value: "go.probo.inc/probo/pkg/coredata.MembershipRoleViewer")
  AUDITOR
    @goEnum(value: "go.probo.inc/probo/pkg/coredata.MembershipRoleAuditor")
}

type Profile implements Node {
    id: ID!
    fullName: String!
    emailAddress: EmailAddr!
    state: ProfileState!
    additionalEmailAddresses: [EmailAddr!]!
    kind: String
    position: String
    contractStartDate: Datetime
    contractEndDate: Datetime
    createdAt: Datetime!
    updatedAt: Datetime!

    permission(action: String!): Boolean! @goField(forceResolver: true)
}

enum ProfileOrderField
    @goModel(model: "go.probo.inc/probo/pkg/coredata.MembershipProfileOrderField") {
    FULL_NAME
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.MembershipProfileOrderFieldFullName"
        )
    CREATED_AT
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.MembershipProfileOrderFieldCreatedAt"
        )
    EMAIL_ADDRESS
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.MembershipProfileOrderFieldEmailAddress"
        )
    KIND @goEnum(value: "go.probo.inc/probo/pkg/coredata.MembershipProfileOrderFieldKind")
}

input ProfileOrder
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.ProfileOrderBy"
    ) {
    direction: OrderDirection!
    field: ProfileOrderField!
}

input ProfileFilter {
    contractEnded: Boolean
    states: [ProfileState!]
    query: String
    role: MembershipRole
    kind: String
}

type ProfileConnection
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.ProfileConnection"
    ) {
    totalCount: Int! @goField(forceResolver: true)
    edges: [ProfileEdge!]!
    pageInfo: PageInfo!
}

type ProfileEdge {
    cursor: CursorKey!
    node: Profile!
}

input UpdateOrganizationContextInput {
    organizationId: ID!
    product: String @goField(omittable: true)
    architecture: String @goField(omittable: true)
    team: String @goField(omittable: true)
    processes: String @goField(omittable: true)
    customers: String @goField(omittable: true)
}

type UpdateOrganizationContextPayload {
    context: OrganizationContext!
}

enum DPORequirementReason
    @goModel(
        model: "go.probo.inc/probo/pkg/malaysiapdpa.DPORequirementReason"
    ) {
    PERSONAL_DATA_VOLUME
        @goEnum(
            value: "go.probo.inc/probo/pkg/malaysiapdpa.DPORequirementReasonPersonalDataVolume"
        )
    SENSITIVE_OR_FINANCIAL_DATA_VOLUME
        @goEnum(
            value: "go.probo.inc/probo/pkg/malaysiapdpa.DPORequirementReasonSensitiveDataVolume"
        )
    REGULAR_AND_SYSTEMATIC_MONITORING
        @goEnum(
            value: "go.probo.inc/probo/pkg/malaysiapdpa.DPORequirementReasonRegularMonitoring"
        )
}

type MalaysiaPDPAProfile {
    organizationId: ID!
    totalDataSubjects: BigInt!
    sensitiveDataSubjects: BigInt!
    regularSystematicMonitoring: Boolean!
    dpoRequired: Boolean! @goField(name: "DPORequired")
    dpoRequirementReasons: [DPORequirementReason!]!
        @goField(name: "DPORequirementReasons")
    assessedByProfileId: ID
    assessedAt: Datetime
    dpoProfileId: ID @goField(name: "DPOProfileID")
    dpoAppointedAt: Datetime @goField(name: "DPOAppointedAt")
    commissionerNotificationDueAt: Datetime
    commissionerNotificationOverdue: Boolean!
    commissionerNotifiedAt: Datetime
    commissionerNotificationReference: String
    createdAt: Datetime
    updatedAt: Datetime
}

input UpdateMalaysiaPDPAProfileInput {
    organizationId: ID!
    totalDataSubjects: BigInt!
    sensitiveDataSubjects: BigInt!
    regularSystematicMonitoring: Boolean!
    dpoProfileId: ID @goField(name: "DPOProfileID")
    dpoAppointedAt: Datetime @goField(name: "DPOAppointedAt")
    commissionerNotifiedAt: Datetime
    commissionerNotificationReference: String
}

type UpdateMalaysiaPDPAProfilePayload {
    malaysiaPDPAProfile: MalaysiaPDPAProfile!
}

