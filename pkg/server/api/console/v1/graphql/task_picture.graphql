enum TaskPictureOrderField
    @goModel(model: "go.probo.inc/probo/pkg/coredata.TaskPictureOrderField") {
    CREATED_AT
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.TaskPictureOrderFieldCreatedAt"
        )
}

input TaskPictureOrder
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.TaskPictureOrderBy"
    ) {
    direction: OrderDirection!
    field: TaskPictureOrderField!
}

type TaskPicture implements Node {
    id: ID!
    task: Task! @goField(forceResolver: true)
    file: File! @goField(forceResolver: true)
    linearAssetUrl: String
    createdAt: Datetime!
    updatedAt: Datetime!
    permission(action: String!): Boolean! @goField(forceResolver: true)
}

type TaskPictureConnection
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.TaskPictureConnection"
    ) {
    totalCount: Int! @goField(forceResolver: true)
    edges: [TaskPictureEdge!]!
    pageInfo: PageInfo!
}

type TaskPictureEdge {
    cursor: CursorKey!
    node: TaskPicture!
}

extend type Mutation {
    uploadTaskPicture(input: UploadTaskPictureInput!): UploadTaskPicturePayload!
    deleteTaskPicture(input: DeleteTaskPictureInput!): DeleteTaskPicturePayload!
}

input UploadTaskPictureInput {
    taskId: ID!
    file: Upload!
}

input DeleteTaskPictureInput {
    taskPictureId: ID!
}

type UploadTaskPicturePayload {
    taskPictureEdge: TaskPictureEdge!
}

type DeleteTaskPicturePayload {
    deletedTaskPictureId: ID!
}
