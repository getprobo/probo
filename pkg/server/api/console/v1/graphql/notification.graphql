enum NotificationType
    @goModel(model: "go.probo.inc/probo/pkg/coredata.NotificationType") {
    DOCUMENT_SIGNATURE_REQUESTED
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.NotificationTypeDocumentSignatureRequested"
        )
    DOCUMENT_APPROVAL_REQUESTED
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.NotificationTypeDocumentApprovalRequested"
        )
    TASK_ASSIGNED
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.NotificationTypeTaskAssigned"
        )
    TASK_MENTIONED
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.NotificationTypeTaskMentioned"
        )
}

enum NotificationStatus
    @goModel(model: "go.probo.inc/probo/pkg/coredata.NotificationStatus") {
    PENDING
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.NotificationStatusPending"
        )
    RESOLVED
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.NotificationStatusResolved"
        )
}

type Notification implements Node {
    id: ID!
    type: NotificationType!
    subjectId: ID!
    title: String!
    status: NotificationStatus!
    readAt: Datetime
    createdAt: Datetime!
}

input NotificationFilter {
    types: [NotificationType!]
    statuses: [NotificationStatus!]
}

type NotificationConnection
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.NotificationConnection"
    ) {
    totalCount: Int! @goField(forceResolver: true)
    edges: [NotificationEdge!]!
    pageInfo: PageInfo!
}

type NotificationEdge {
    cursor: CursorKey!
    node: Notification!
}

extend type Mutation {
    markAllNotificationsRead(
        input: MarkAllNotificationsReadInput!
    ): MarkAllNotificationsReadPayload!
}

input MarkAllNotificationsReadInput {
    organizationId: ID!
    types: [NotificationType!]
}

type MarkAllNotificationsReadPayload {
    organizationId: ID!
}
