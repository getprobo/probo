"""
CreateOrganizationConnectorInput connects one credential for a whole cloud
organization rather than a single account.

It is a separate mutation from createWorkloadIdentityConnector rather than a
flag on it, because the intent is what differs: the accounts of an
organization credential come from discovery and the user's choice, not from
the settings. Nothing about the stored connector row records which it was.
"""
input CreateOrganizationConnectorInput {
    organizationId: ID!
    provider: ConnectorProvider!
    """
    awsRoleArn names the management account role. awsMemberRoleName is the
    role the customer's StackSet created in every member account; omit it to
    use the name the published template uses.
    """
    awsRoleArn: String
    awsMemberRoleName: String
    """
    gcpParent is the Cloud Asset scope discovery and reads run under:
    organizations/{number}, or folders/{number} for a partial install. It is
    the confinement boundary, so it is required for GCP.
    """
    gcpWorkloadIdentityProvider: String
    gcpServiceAccountEmail: String
    gcpParent: String
    """
    An organization-wide Azure credential names no subscription: discovery is
    what finds them.
    """
    azureTenantId: String
    azureClientId: String
    azureEnvironment: AzureEnvironment
}

type CreateOrganizationConnectorPayload {
    connector: Connector!
    """
    discoveredAccounts is what the credential could reach at create time.
    Empty when discovery failed, which does not fail the mutation: the
    connector exists and discovery can be retried.
    """
    discoveredAccounts: [DiscoveredConnectorAccount!]!
}

