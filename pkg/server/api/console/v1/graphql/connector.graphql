type ConnectorProviderInfo {
    provider: ConnectorProvider!
    displayName: String!
    """
    documentationUrl is the public probo.com docs page for connecting this
    provider as an access source, or null when no doc page exists yet.
    """
    documentationUrl: String
    """
    oauthConfigured is retained for v1 clients that have not migrated to
    configuredProtocols.
    """
    oauthConfigured: Boolean!
        @deprecated(reason: "Use configuredProtocols instead.")
    """
    configuredProtocols lists the connector protocols that are ready to use
    for this provider in this deployment (for example OAUTH2 or GITHUB_APP).
    Empty when the provider is only reachable via customer-supplied
    credentials (API key or client credentials).
    """
    configuredProtocols: [ConnectorProtocol!]!
    apiKeySupported: Boolean!
    """
    apiKeyManaged is true when the provider connects with a Probo-supplied
    API key (Model B) that the operator has configured, through the API-key
    form: the customer supplies only the extra settings, not the key. False
    until the key is configured, which keeps such a provider out of the
    catalog, and false for a managed provider whose connect path is an app
    install (installSupported), which has no form at all.
    """
    apiKeyManaged: Boolean!
    clientCredentialsSupported: Boolean!
    oauth2Scopes: [String!]!
    """
    apiKeyExtraSettings lists the per-provider settings the API-key connect
    form must render and submit, in render order. Empty when the provider needs
    none or has no API-key path.
    """
    apiKeyExtraSettings: [ConnectorProviderSettingInfo!]!
    """
    apiKeyFormat is the shape a pasted API key must have, for the connect form
    to check as the customer leaves the field and to show as its placeholder.
    Null when the provider's keys have no shape worth asserting, which is the
    common case. The create mutation applies the same rule, so a client that
    skips this check is refused rather than trusted.
    """
    apiKeyFormat: ConnectorAPIKeyFormat
    """
    clientCredentialsExtraSettings lists the settings the client-credentials
    connect form must render and submit. A provider offering both paths
    (1Password) returns different fields here than in apiKeyExtraSettings,
    because a different settings struct and driver sits behind each — so a
    client cannot render one path's settings on the other.
    """
    clientCredentialsExtraSettings: [ConnectorProviderSettingInfo!]!
    """
    organizationInstallSupported is true when this provider can be connected
    once for a whole organization and have its accounts discovered, rather
    than one connector per account.
    """
    organizationInstallSupported: Boolean!
    """
    workloadIdentitySupported is true when this provider connects by federating
    a Probo-issued OIDC token into the customer's cloud account, and this
    deployment has the identity federation issuer enabled.
    """
    workloadIdentitySupported: Boolean!
    """
    workloadIdentityExtraSettings lists the settings the workload-identity
    connect form must render and submit, in render order. Empty when the
    provider has no workload-identity path.
    """
    workloadIdentityExtraSettings: [ConnectorProviderSettingInfo!]!
    """
    installSupported is true when this provider is connected by installing
    Probo's app at the vendor: the client redirects to the install ceremony
    instead of rendering a credential form, and the vendor tenant is proven
    server-side on the way back. False until the operator has configured the
    Probo-held credentials the ceremony needs.
    """
    installSupported: Boolean!
}

