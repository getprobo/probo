"""
DiscoveredConnectorAccount is an account the credential can reach right now,
as the vendor reports it. It is not a stored row: an account becomes a
ConnectorAccount only once enableConnectorAccounts records it.
"""
type DiscoveredConnectorAccount {
    externalAccountId: String!
    name: String!
    """
    enabled is true when this organization has already recorded the account,
    so a client can render a discover list without a second round trip.
    """
    enabled: Boolean!
}

