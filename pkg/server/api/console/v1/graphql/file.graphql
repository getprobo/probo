type File {
    id: ID!
    mimeType: String!
    fileName: String!
    size: BigInt!
    downloadUrl: String!
    createdAt: Datetime!
    updatedAt: Datetime!
}

extend type Mutation {
    uploadFile(
        input: UploadFileInput!
    ): UploadFilePayload!
}

input UploadFileInput {
    organizationId: ID!
    file: Upload!
}

type UploadFilePayload {
    file: File!
}
