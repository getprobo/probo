type File {
    id: ID!
    mimeType: String!
    fileName: String!
    size: BigInt!
    downloadUrl: String!
    createdAt: Datetime!
    updatedAt: Datetime!
}

extend type Mutation {
    uploadAttachmentFile(
        input: UploadAttachmentFileInput!
    ): UploadAttachmentFilePayload!
}

input UploadAttachmentFileInput {
    organizationId: ID!
    file: Upload!
}

type UploadAttachmentFilePayload {
    file: File!
}
