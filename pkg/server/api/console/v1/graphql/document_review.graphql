    anchorEnd: String!
    anchorQuote: String!
    resolvedAt: Datetime
    resolvedBy: Profile @goField(forceResolver: true)
    comments(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: DocumentCommentOrder
    ): DocumentCommentConnection! @goField(forceResolver: true)
    createdAt: Datetime!
    updatedAt: Datetime!
    permission(action: String!): Boolean! @goField(forceResolver: true)
}

