}

type AddDocumentSuggestionTableChangePayload {
    documentSuggestion: DocumentSuggestion!
}

type AddDocumentSuggestionFormatChangePayload {
    documentSuggestion: DocumentSuggestion!
}

type AcceptDocumentSuggestionPayload {
    documentSuggestion: DocumentSuggestion!
}

type RejectDocumentSuggestionPayload {
    documentSuggestion: DocumentSuggestion!
}
