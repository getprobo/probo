extend type Mutation {
    createDocumentCommentThread(
        input: CreateDocumentCommentThreadInput!
    ): CreateDocumentCommentThreadPayload!
    createDocumentComment(
        input: CreateDocumentCommentInput!
    ): CreateDocumentCommentPayload!
    updateDocumentComment(
        input: UpdateDocumentCommentInput!
    ): UpdateDocumentCommentPayload!
    deleteDocumentComment(
        input: DeleteDocumentCommentInput!
    ): DeleteDocumentCommentPayload!
    resolveDocumentCommentThread(
        input: ResolveDocumentCommentThreadInput!
    ): ResolveDocumentCommentThreadPayload!
    reopenDocumentCommentThread(
        input: ReopenDocumentCommentThreadInput!
    ): ReopenDocumentCommentThreadPayload!
    """
    Allocate a redline ID. Pass quote and replacement to mark that text in the
    document: the quote is a deletion, the replacement is an insertion, and the
    rest of the document is left unchanged. Pass comment to attach a plain-text
    note. Without quote, only an ID is allocated.
    """
    startDocumentSuggestion(
        input: StartDocumentSuggestionInput!
    ): StartDocumentSuggestionPayload!
    """
    Add another redline to an open suggestion. The quote is a deletion and the
    replacement is an insertion under the same suggestion. The quote must not
    overlap a redline that is already in the document.
    """
    addDocumentSuggestionChange(
        input: AddDocumentSuggestionChangeInput!
    ): AddDocumentSuggestionChangePayload!
    addDocumentSuggestionTableChange(
        input: AddDocumentSuggestionTableChangeInput!
    ): AddDocumentSuggestionTableChangePayload!
    addDocumentSuggestionFormatChange(
        input: AddDocumentSuggestionFormatChangeInput!
    ): AddDocumentSuggestionFormatChangePayload!
    acceptDocumentSuggestion(
        input: AcceptDocumentSuggestionInput!
    ): AcceptDocumentSuggestionPayload!
    rejectDocumentSuggestion(
        input: RejectDocumentSuggestionInput!
    ): RejectDocumentSuggestionPayload!
}

input CreateDocumentCommentThreadInput {
    documentId: ID!
    content: String!
    quote: String
    anchorStart: String
    anchorEnd: String
    suggestionId: ID
    quoteOccurrence: Int
}

input CreateDocumentCommentInput {
    threadId: ID!
    content: String!
}

input UpdateDocumentCommentInput {
    commentId: ID!
    content: String!
}

input DeleteDocumentCommentInput {
    commentId: ID!
}

input ResolveDocumentCommentThreadInput {
    threadId: ID!
}

input ReopenDocumentCommentThreadInput {
    threadId: ID!
}

input StartDocumentSuggestionInput {
    documentId: ID!
    "Text to replace. The match is the editor selection."
    quote: String
    "Suggested text. Empty deletes the quote. Required when quote is set."
    replacement: String
    "Plain-text note attached to the redline."
    comment: String
    "Zero-based occurrence of quote. Defaults to the first match."
    quoteOccurrence: Int
}

input AddDocumentSuggestionChangeInput {
    suggestionId: ID!
    "Text to replace. The match is the editor selection."
    quote: String!
    "Suggested text. Empty deletes the quote."
    replacement: String!
    "Zero-based occurrence of quote. Defaults to the first match."
    quoteOccurrence: Int
}

input AddDocumentSuggestionTableChangeInput {
    suggestionId: ID!
    operation: DocumentSuggestionTableOperation!
    """
    Text inside a cell of the row, column, or table to change. For
    INSERT_TABLE, text of the top-level block the new table goes beside.
    """
    quote: String!
    "Zero-based occurrence of quote. Defaults to the first match."
    quoteOccurrence: Int
    "Insert before the quoted row, column, or block instead of after it."
    before: Boolean
    """
    Text of the new row's cells left to right, or the new column's cells top
    to bottom. Omit for empty cells.
    """
    cells: [String!]
    "Rows of the new table for INSERT_TABLE, each with the same cell count."
    rows: [[String!]!]
    "Make the new table's first row a header row."
    headerRow: Boolean
}

input AddDocumentSuggestionFormatChangeInput {
    suggestionId: ID!
    mark: DocumentSuggestionFormatMark!
    action: DocumentSuggestionFormatAction!
    "Text to format. The match is the editor selection."
    quote: String!
    "Zero-based occurrence of quote. Defaults to the first match."
    quoteOccurrence: Int
    "Link address when mark is LINK and action is ADD."
    href: String
}

input AcceptDocumentSuggestionInput {
    suggestionId: ID!
}

input RejectDocumentSuggestionInput {
    suggestionId: ID!
}

type CreateDocumentCommentThreadPayload {
    documentCommentThreadEdge: DocumentCommentThreadEdge!
}

