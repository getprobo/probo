}

type ReopenDocumentCommentThreadPayload {
    documentCommentThread: DocumentCommentThread!
}

type StartDocumentSuggestionPayload {
    documentSuggestionEdge: DocumentSuggestionEdge!
}

type AddDocumentSuggestionChangePayload {
