enum InternalControlType
    @goModel(model: "go.probo.inc/probo/pkg/coredata.InternalControlType") {
    PREVENTIVE
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.InternalControlTypePreventive"
        )
    DETECTIVE
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.InternalControlTypeDetective"
        )
    CORRECTIVE
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.InternalControlTypeCorrective"
        )
}

enum InternalControlNature
    @goModel(model: "go.probo.inc/probo/pkg/coredata.InternalControlNature") {
    MANUAL
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.InternalControlNatureManual"
        )
}

enum InternalControlOperatingMode
    @goModel(
        model: "go.probo.inc/probo/pkg/coredata.InternalControlOperatingMode"
    ) {
    CONTINUOUS
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.InternalControlOperatingModeContinuous"
        )
    EVENT
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.InternalControlOperatingModeEvent"
        )
    PERIODIC
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.InternalControlOperatingModePeriodic"
        )
}

type InternalControlOperatingFrequency
    @goModel(
        model: "go.probo.inc/probo/pkg/coredata.InternalControlOperatingFrequency"
    ) {
    mode: InternalControlOperatingMode!
    interval: TimeSpan
    event: String
}

input InternalControlOperatingFrequencyInput
    @goModel(
        model: "go.probo.inc/probo/pkg/coredata.InternalControlOperatingFrequency"
    ) {
    mode: InternalControlOperatingMode!
    interval: TimeSpan
    event: String
}

