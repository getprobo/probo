    @goModel(
        model: "go.probo.inc/probo/pkg/coredata.InternalControlImplementationStatus"
    ) {
    NOT_IMPLEMENTED
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.InternalControlImplementationStatusNotImplemented"
        )
    IN_PROGRESS
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.InternalControlImplementationStatusInProgress"
        )
    IMPLEMENTED
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.InternalControlImplementationStatusImplemented"
        )
    OPERATING
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.InternalControlImplementationStatusOperating"
        )
}

enum MeasureState
    @goModel(model: "go.probo.inc/probo/pkg/coredata.MeasureState") {
    NOT_STARTED
        @goEnum(value: "go.probo.inc/probo/pkg/coredata.MeasureStateNotStarted")
    IN_PROGRESS
        @goEnum(value: "go.probo.inc/probo/pkg/coredata.MeasureStateInProgress")
    NOT_APPLICABLE
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.MeasureStateNotApplicable"
        )
    IMPLEMENTED
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.MeasureStateImplemented"
        )
    UNKNOWN
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.MeasureStateUnknown"
        )
    NOT_IMPLEMENTED
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.MeasureStateNotImplemented"
        )
}

enum MeasureOrderField
    @goModel(model: "go.probo.inc/probo/pkg/coredata.MeasureOrderField") {
    CREATED_AT
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.MeasureOrderFieldCreatedAt"
        )
    NAME @goEnum(value: "go.probo.inc/probo/pkg/coredata.MeasureOrderFieldName")
}

input MeasureOrder
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.MeasureOrderBy"
    ) {
    direction: OrderDirection!
    field: MeasureOrderField!
}

input MeasureFilter {
    query: String
    state: MeasureState
    category: String
}

type Measure implements Node {
    id: ID!
    category: String!
    name: String!
    description: String
    state: MeasureState!
    code: String
    controlType: InternalControlType
    nature: InternalControlNature
    operatingFrequency: InternalControlOperatingFrequency
    evidenceCadence: TimeSpan
    testingCadence: TimeSpan
    nextEvidenceDue: Datetime
    nextTestDue: Datetime
    implementationStatus: InternalControlImplementationStatus!
    owner: Profile @goField(forceResolver: true)
    reviewer: Profile @goField(forceResolver: true)
    asOf: Datetime

    evidences(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: EvidenceOrder
    ): EvidenceConnection! @goField(forceResolver: true)

    tasks(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: TaskOrder
        filter: TaskFilter
    ): TaskConnection! @goField(forceResolver: true)

    risks(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: RiskOrder
        filter: RiskFilter
    ): RiskConnection! @goField(forceResolver: true)

    controls(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: ControlOrder
        filter: ControlFilter
    ): ControlConnection! @goField(forceResolver: true)

    documents(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: DocumentOrder
        filter: DocumentFilter
    ): DocumentConnection! @goField(forceResolver: true)

    thirdParties(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: ThirdPartyOrder
    ): ThirdPartyConnection! @goField(forceResolver: true)

    treatmentPlans(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: TreatmentPlanOrder
        filter: TreatmentPlanFilter
        asOf: Datetime
    ): TreatmentPlanConnection! @goField(forceResolver: true)

    createdAt: Datetime!
    updatedAt: Datetime!

    permission(action: String!): Boolean! @goField(forceResolver: true)
}

type MeasureConnection
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.MeasureConnection"
    ) {
    totalCount: Int! @goField(forceResolver: true)
    edges: [MeasureEdge!]!
    pageInfo: PageInfo!
    asOf: Datetime
}

type MeasureEdge {
    cursor: CursorKey!
    node: Measure!
}

extend type Mutation {
    createMeasure(input: CreateMeasureInput!): CreateMeasurePayload!
    updateMeasure(input: UpdateMeasureInput!): UpdateMeasurePayload!
    importMeasure(input: ImportMeasureInput!): ImportMeasurePayload!
    deleteMeasure(input: DeleteMeasureInput!): DeleteMeasurePayload!
    createMeasureDocumentMapping(
        input: CreateMeasureDocumentMappingInput!
    ): CreateMeasureDocumentMappingPayload!
    deleteMeasureDocumentMapping(
        input: DeleteMeasureDocumentMappingInput!
    ): DeleteMeasureDocumentMappingPayload!
    createMeasureThirdPartyMapping(
        input: CreateMeasureThirdPartyMappingInput!
    ): CreateMeasureThirdPartyMappingPayload!
    deleteMeasureThirdPartyMapping(
        input: DeleteMeasureThirdPartyMappingInput!
    ): DeleteMeasureThirdPartyMappingPayload!
}

input CreateMeasureInput {
    organizationId: ID!
    name: String!
    description: String
    category: String!
    code: String
    controlType: InternalControlType
    nature: InternalControlNature
    operatingFrequency: InternalControlOperatingFrequencyInput
    evidenceCadence: TimeSpan
    testingCadence: TimeSpan
    implementationStatus: InternalControlImplementationStatus
    ownerId: ID
    reviewerId: ID
}

input UpdateMeasureInput {
    id: ID!
    name: String
    description: String @goField(omittable: true)
    category: String
    state: MeasureState
    code: String @goField(omittable: true)
    controlType: InternalControlType @goField(omittable: true)
    nature: InternalControlNature @goField(omittable: true)
    operatingFrequency: InternalControlOperatingFrequencyInput @goField(omittable: true)
    evidenceCadence: TimeSpan @goField(omittable: true)
    testingCadence: TimeSpan @goField(omittable: true)
    implementationStatus: InternalControlImplementationStatus
    ownerId: ID @goField(omittable: true)
    reviewerId: ID @goField(omittable: true)
}

input ImportMeasureInput {
    organizationId: ID!
    file: Upload!
}

input DeleteMeasureInput {
    measureId: ID!
}

input CreateMeasureDocumentMappingInput {
    measureId: ID!
    documentId: ID!
}

input DeleteMeasureDocumentMappingInput {
    measureId: ID!
    documentId: ID!
}

type CreateMeasurePayload {
    measureEdge: MeasureEdge!
}

type UpdateMeasurePayload {
    measure: Measure!
}

type ImportMeasurePayload {
    measureEdges: [MeasureEdge!]!
}

type DeleteMeasurePayload {
    deletedMeasureId: ID!
}

type CreateMeasureDocumentMappingPayload {
    measureEdge: MeasureEdge!
    documentEdge: DocumentEdge!
}

type DeleteMeasureDocumentMappingPayload {
    deletedMeasureId: ID!
    deletedDocumentId: ID!
}

input CreateMeasureThirdPartyMappingInput {
    measureId: ID!
    thirdPartyId: ID!
}

input DeleteMeasureThirdPartyMappingInput {
    measureId: ID!
    thirdPartyId: ID!
}

type CreateMeasureThirdPartyMappingPayload {
    measureEdge: MeasureEdge!
    thirdPartyEdge: ThirdPartyEdge!
}

type DeleteMeasureThirdPartyMappingPayload {
    deletedMeasureId: ID!
    deletedThirdPartyId: ID!
}
