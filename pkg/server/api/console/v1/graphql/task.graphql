enum TaskState @goModel(model: "go.probo.inc/probo/pkg/coredata.TaskState") {
    BACKLOG @goEnum(value: "go.probo.inc/probo/pkg/coredata.TaskStateBacklog")
    TODO @goEnum(value: "go.probo.inc/probo/pkg/coredata.TaskStateTodo")
    IN_PROGRESS @goEnum(value: "go.probo.inc/probo/pkg/coredata.TaskStateInProgress")
    DONE @goEnum(value: "go.probo.inc/probo/pkg/coredata.TaskStateDone")
    CANCELED @goEnum(value: "go.probo.inc/probo/pkg/coredata.TaskStateCanceled")
    DUPLICATE @goEnum(value: "go.probo.inc/probo/pkg/coredata.TaskStateDuplicate")
}

enum TaskPriority
    @goModel(model: "go.probo.inc/probo/pkg/coredata.TaskPriority") {
    URGENT
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.TaskPriorityUrgent"
        )
    HIGH
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.TaskPriorityHigh"
        )
    MEDIUM
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.TaskPriorityMedium"
        )
    LOW
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.TaskPriorityLow"
        )
}

enum TaskOrderField
    @goModel(model: "go.probo.inc/probo/pkg/coredata.TaskOrderField") {
    PRIORITY_RANK
    CREATED_AT
}

input TaskOrder
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.TaskOrderBy"
    ) {
    direction: OrderDirection!
    field: TaskOrderField!
}

input TaskFilter {
    query: String
    state: TaskState
}

type Task implements Node {
    id: ID!
    name: String!
    content: String!
    state: TaskState!
    priority: TaskPriority!
    rank: Int!
    timeEstimate: TimeSpan
    deadline: Datetime
    recurrenceInterval: TimeSpan
    assignedTo: Profile @goField(forceResolver: true)

    organization: Organization! @goField(forceResolver: true)
    measure: Measure @goField(forceResolver: true)

    evidences(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: EvidenceOrder
    ): EvidenceConnection! @goField(forceResolver: true)

    comments(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: TaskCommentOrder
    ): TaskCommentConnection! @goField(forceResolver: true)

    activities(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: TaskActivityOrder
    ): TaskActivityConnection! @goField(forceResolver: true)

    externalLink: TaskExternalLink @goField(forceResolver: true)

    createdAt: Datetime!
    updatedAt: Datetime!

    permission(action: String!): Boolean! @goField(forceResolver: true)
}

enum TaskExternalLinkOrigin
    @goModel(model: "go.probo.inc/probo/pkg/coredata.TaskExternalLinkOrigin") {
    PROBO
        @goEnum(value: "go.probo.inc/probo/pkg/coredata.TaskExternalLinkOriginProbo")
    LINEAR
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.TaskExternalLinkOriginLinear"
        )
}

type TaskExternalLink {
    provider: ConnectorProvider!
    identifier: String!
    url: String!
    origin: TaskExternalLinkOrigin!
}

type LinearTeam {
    id: String!
    name: String!
    key: String!
}

type LinearPageInfo {
    hasNextPage: Boolean!
    hasPreviousPage: Boolean!
    startCursor: String
    endCursor: String
}

type LinearTeamEdge {
    cursor: String!
    node: LinearTeam!
}

type LinearTeamConnection {
    edges: [LinearTeamEdge!]!
    pageInfo: LinearPageInfo!
}

type LinearIssue {
    id: String!
    identifier: String!
    title: String!
    content: String
    state: TaskState
    priority: TaskPriority
}

type LinearIssueEdge {
    cursor: String!
    node: LinearIssue!
}

type LinearIssueConnection {
    edges: [LinearIssueEdge!]!
    pageInfo: LinearPageInfo!
}

type TaskConnection
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.TaskConnection"
    ) {
    totalCount: Int! @goField(forceResolver: true)
    edges: [TaskEdge!]!
    pageInfo: PageInfo!
}

type TaskEdge {
    cursor: CursorKey!
    node: Task!
}

extend type Mutation {
    createTask(input: CreateTaskInput!): CreateTaskPayload!
    updateTask(input: UpdateTaskInput!): UpdateTaskPayload!
    deleteTask(input: DeleteTaskInput!): DeleteTaskPayload!
    publishTaskToLinear(input: PublishTaskToLinearInput!): PublishTaskToLinearPayload!
    linkTaskToLinear(input: LinkTaskToLinearInput!): LinkTaskToLinearPayload!
    unlinkTaskExternal(input: UnlinkTaskExternalInput!): UnlinkTaskExternalPayload!
}

input CreateTaskInput {
    organizationId: ID!
    measureId: ID
    name: String!
    content: String
    state: TaskState
    priority: TaskPriority!
    timeEstimate: TimeSpan
    assignedToId: ID
    deadline: Datetime
    recurrenceInterval: TimeSpan
}

input UpdateTaskInput {
    taskId: ID!
    name: String
    content: String @goField(omittable: true)
    state: TaskState
    priority: TaskPriority
    rank: Int
    timeEstimate: TimeSpan @goField(omittable: true)
    deadline: Datetime @goField(omittable: true)
    assignedToId: ID @goField(omittable: true)
    measureId: ID @goField(omittable: true)
    recurrenceInterval: TimeSpan @goField(omittable: true)
}

input DeleteTaskInput {
    taskId: ID!
}

type CreateTaskPayload {
    taskEdge: TaskEdge!
}

type UpdateTaskPayload {
    task: Task!
    nextTaskEdge: TaskEdge
}

type DeleteTaskPayload {
    deletedTaskId: ID!
}

input PublishTaskToLinearInput {
    taskId: ID!
    teamId: String!
}

type PublishTaskToLinearPayload {
    task: Task!
}

input LinkTaskToLinearInput {
    taskId: ID!
    teamId: String!
    issueId: String!
}

type LinkTaskToLinearPayload {
    task: Task!
}

input UnlinkTaskExternalInput {
    taskId: ID!
}

type UnlinkTaskExternalPayload {
    task: Task!
}
