enum CorrectiveActionPlanOrderField
    @goModel(
        model: "go.probo.inc/probo/pkg/coredata.CorrectiveActionPlanOrderField"
    ) {
    CREATED_AT
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.CorrectiveActionPlanOrderFieldCreatedAt"
        )
    DUE_DATE
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.CorrectiveActionPlanOrderFieldDueDate"
        )
}

input CorrectiveActionPlanOrder
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.CorrectiveActionPlanOrderBy"
    ) {
    direction: OrderDirection!
    field: CorrectiveActionPlanOrderField!
}

type CorrectiveActionPlan implements Node {
    id: ID!
    title: String!
    description: String
    dueDate: Datetime
    owner: Profile @goField(forceResolver: true)
    finding: Finding! @goField(forceResolver: true)
    organization: Organization! @goField(forceResolver: true)

    internalControls(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: InternalControlOrder
        filter: InternalControlFilter
    ): InternalControlConnection! @goField(forceResolver: true)

    tasks(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: TaskOrder
        filter: TaskFilter
    ): TaskConnection! @goField(forceResolver: true)

    createdAt: Datetime!
    updatedAt: Datetime!

    permission(action: String!): Boolean! @goField(forceResolver: true)
}

type CorrectiveActionPlanConnection
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.CorrectiveActionPlanConnection"
    ) {
    totalCount: Int! @goField(forceResolver: true)
    edges: [CorrectiveActionPlanEdge!]!
    pageInfo: PageInfo!
}

type CorrectiveActionPlanEdge {
    cursor: CursorKey!
    node: CorrectiveActionPlan!
}

extend type Mutation {
    createCorrectiveActionPlan(
        input: CreateCorrectiveActionPlanInput!
    ): CreateCorrectiveActionPlanPayload!
    updateCorrectiveActionPlan(
        input: UpdateCorrectiveActionPlanInput!
    ): UpdateCorrectiveActionPlanPayload!
    deleteCorrectiveActionPlan(
        input: DeleteCorrectiveActionPlanInput!
    ): DeleteCorrectiveActionPlanPayload!
    createCorrectiveActionPlanInternalControlMapping(
        input: CreateCorrectiveActionPlanInternalControlMappingInput!
    ): CreateCorrectiveActionPlanInternalControlMappingPayload!
    deleteCorrectiveActionPlanInternalControlMapping(
        input: DeleteCorrectiveActionPlanInternalControlMappingInput!
    ): DeleteCorrectiveActionPlanInternalControlMappingPayload!
}

input CreateCorrectiveActionPlanInput {
    findingId: ID!
    title: String!
    description: String
    ownerId: ID
    dueDate: Datetime
}

input UpdateCorrectiveActionPlanInput {
    id: ID!
    title: String
    description: String @goField(omittable: true)
    ownerId: ID @goField(omittable: true)
    dueDate: Datetime @goField(omittable: true)
}

input DeleteCorrectiveActionPlanInput {
    correctiveActionPlanId: ID!
}

input CreateCorrectiveActionPlanInternalControlMappingInput {
    correctiveActionPlanId: ID!
    internalControlId: ID!
}

input DeleteCorrectiveActionPlanInternalControlMappingInput {
    correctiveActionPlanId: ID!
    internalControlId: ID!
}

type CreateCorrectiveActionPlanPayload {
    correctiveActionPlanEdge: CorrectiveActionPlanEdge!
}

type UpdateCorrectiveActionPlanPayload {
    correctiveActionPlan: CorrectiveActionPlan!
}

type DeleteCorrectiveActionPlanPayload {
    deletedCorrectiveActionPlanId: ID!
}

type CreateCorrectiveActionPlanInternalControlMappingPayload {
    correctiveActionPlanEdge: CorrectiveActionPlanEdge!
    internalControlEdge: InternalControlEdge!
}

type DeleteCorrectiveActionPlanInternalControlMappingPayload {
    deletedCorrectiveActionPlanId: ID!
    deletedInternalControlId: ID!
}
