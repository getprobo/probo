type AssetSnapshot implements Node
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.AssetSnapshot"
    ) {
    id: ID!
    capturedAt: Datetime!
    actor: Profile @goField(forceResolver: true)
    name: String
    note: String
    assets(
        first: Int
        after: CursorKey
        last: Int
        before: CursorKey
        orderBy: AssetSnapshotAssetOrder
    ): AssetSnapshotAssetConnection! @goField(forceResolver: true)
    permission(action: String!): Boolean! @goField(forceResolver: true)
}

type AssetSnapshotAsset
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/console/v1/types.AssetSnapshotAsset"
    ) {
    id: ID!
    assetId: ID!
    name: String!
    amount: Int!
    owner: Profile @goField(forceResolver: true)
    assetType: AssetType!
    dataTypesStored: String
    kind: String
    externalId: String
    region: String
    configuration: String
    schemaVersion: Int
    lastSeenAt: Datetime
    status: AssetStatus!
    connectorId: ID
    thirdPartyIds: [ID!]!
    businessFunctionIds: [ID!]!
    tagIds: [ID!]!
    assetCreatedAt: Datetime!
    assetUpdatedAt: Datetime!
}

