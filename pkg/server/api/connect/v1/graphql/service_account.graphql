enum ServiceAccountOrderField
  @goModel(
    model: "go.probo.inc/probo/pkg/coredata.ServiceAccountOrderField"
  ) {
  CREATED_AT
    @goEnum(
      value: "go.probo.inc/probo/pkg/coredata.ServiceAccountOrderFieldCreatedAt"
    )
  NAME
    @goEnum(
      value: "go.probo.inc/probo/pkg/coredata.ServiceAccountOrderFieldName"
    )
}

input ServiceAccountOrder
  @goModel(
    model: "go.probo.inc/probo/pkg/server/api/connect/v1/types.ServiceAccountOrderBy"
  ) {
  field: ServiceAccountOrderField!
  direction: OrderDirection!
}

type ServiceAccount implements Node {
  id: ID!
  organizationId: ID!
  name: String!
  description: String
  scopes: [OAuth2Scope!]!
  disabledAt: Datetime
  createdAt: Datetime!
  updatedAt: Datetime!

  credentials(
    first: Int
    after: CursorKey
    last: Int
    before: CursorKey
    orderBy: ServiceAccountCredentialOrder
  ): ServiceAccountCredentialConnection!
    @goField(forceResolver: true)

  permission(action: String!): Boolean!
    @goField(forceResolver: true)
    @authentication(required: PRESENT)
}

type ServiceAccountConnection
  @goModel(
    model: "go.probo.inc/probo/pkg/server/api/connect/v1/types.ServiceAccountConnection"
  ) {
  edges: [ServiceAccountEdge!]!
  pageInfo: PageInfo!
  totalCount: Int! @goField(forceResolver: true)
}

type ServiceAccountEdge {
  cursor: CursorKey!
  node: ServiceAccount!
}

enum ServiceAccountCredentialOrderField
  @goModel(
    model: "go.probo.inc/probo/pkg/coredata.ServiceAccountCredentialOrderField"
  ) {
  CREATED_AT
    @goEnum(
      value: "go.probo.inc/probo/pkg/coredata.ServiceAccountCredentialOrderFieldCreatedAt"
    )
  NAME
    @goEnum(
      value: "go.probo.inc/probo/pkg/coredata.ServiceAccountCredentialOrderFieldName"
    )
}

input ServiceAccountCredentialOrder
  @goModel(
    model: "go.probo.inc/probo/pkg/server/api/connect/v1/types.ServiceAccountCredentialOrderBy"
  ) {
  field: ServiceAccountCredentialOrderField!
  direction: OrderDirection!
}

type ServiceAccountCredential implements Node {
  id: ID!
  serviceAccountId: ID!
  name: String!
  scopes: [OAuth2Scope!]!
  expiresAt: Datetime!
  lastUsedAt: Datetime
  revokedAt: Datetime
  createdAt: Datetime!
}

type ServiceAccountCredentialConnection
  @goModel(
    model: "go.probo.inc/probo/pkg/server/api/connect/v1/types.ServiceAccountCredentialConnection"
  ) {
  edges: [ServiceAccountCredentialEdge!]!
  pageInfo: PageInfo!
  totalCount: Int! @goField(forceResolver: true)
}

type ServiceAccountCredentialEdge {
  cursor: CursorKey!
  node: ServiceAccountCredential!
}

extend type Mutation {
  createServiceAccount(
    input: CreateServiceAccountInput!
  ): CreateServiceAccountPayload @authentication(required: PRESENT)
  updateServiceAccount(
    input: UpdateServiceAccountInput!
  ): UpdateServiceAccountPayload @authentication(required: PRESENT)
  disableServiceAccount(
    input: DisableServiceAccountInput!
  ): DisableServiceAccountPayload @authentication(required: PRESENT)
  deleteServiceAccount(
    input: DeleteServiceAccountInput!
  ): DeleteServiceAccountPayload @authentication(required: PRESENT)
  createServiceAccountCredential(
    input: CreateServiceAccountCredentialInput!
  ): CreateServiceAccountCredentialPayload @authentication(required: PRESENT)
  revokeServiceAccountCredential(
    input: RevokeServiceAccountCredentialInput!
  ): RevokeServiceAccountCredentialPayload @authentication(required: PRESENT)
}

input CreateServiceAccountInput {
  organizationId: ID!
  name: String!
  description: String
  scopes: [OAuth2Scope!]!
}

input UpdateServiceAccountInput {
  serviceAccountId: ID!
  name: String
  description: String @goField(omittable: true)
  scopes: [OAuth2Scope!]
}

input DisableServiceAccountInput {
  serviceAccountId: ID!
}

input DeleteServiceAccountInput {
  serviceAccountId: ID!
}

input CreateServiceAccountCredentialInput {
  serviceAccountId: ID!
  name: String!
  scopes: [OAuth2Scope!]!
  expiresAt: Datetime!
}

input RevokeServiceAccountCredentialInput {
  serviceAccountId: ID!
  serviceAccountCredentialId: ID!
}

type CreateServiceAccountPayload {
  serviceAccountEdge: ServiceAccountEdge!
}

type UpdateServiceAccountPayload {
  serviceAccount: ServiceAccount!
}

type DisableServiceAccountPayload {
  serviceAccount: ServiceAccount!
}

type DeleteServiceAccountPayload {
  deletedServiceAccountId: ID!
}

type CreateServiceAccountCredentialPayload {
  serviceAccountCredentialEdge: ServiceAccountCredentialEdge!
  token: String!
}

type RevokeServiceAccountCredentialPayload {
  serviceAccountCredential: ServiceAccountCredential!
}
