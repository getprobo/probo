enum NotificationType
    @goModel(model: "go.probo.inc/probo/pkg/coredata.NotificationType") {
    DOCUMENT_SIGNATURE_REQUESTED
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.NotificationTypeDocumentSignatureRequested"
        )
    DOCUMENT_APPROVAL_REQUESTED
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.NotificationTypeDocumentApprovalRequested"
        )
    TASK_ASSIGNED
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.NotificationTypeTaskAssigned"
        )
    TASK_MENTIONED
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.NotificationTypeTaskMentioned"
        )
}

enum NotificationEmailDelivery
    @goModel(model: "go.probo.inc/probo/pkg/coredata.NotificationEmailDelivery") {
    NONE
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.NotificationEmailDeliveryNone"
        )
    EACH
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.NotificationEmailDeliveryEach"
        )
    REMINDERS
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.NotificationEmailDeliveryReminders"
        )
    WEEKLY
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.NotificationEmailDeliveryWeekly"
        )
}

type NotificationPreference {
    type: NotificationType!
    email: NotificationEmailDelivery!
}

extend type Mutation {
    updateNotificationPreference(
        input: UpdateNotificationPreferenceInput!
    ): UpdateNotificationPreferencePayload!
        @authentication(required: PRESENT)
        @sessionOnly
}

input UpdateNotificationPreferenceInput {
    organizationId: ID!
    type: NotificationType!
    email: NotificationEmailDelivery!
}

type UpdateNotificationPreferencePayload {
    preference: NotificationPreference!
}
