type Identity implements Node {
  id: ID!
  email: EmailAddr!
  fullName: String!
  emailVerified: Boolean!
  avatar: File @goField(forceResolver: true)
  createdAt: Datetime!
  updatedAt: Datetime!

  profiles(
    first: Int
    after: CursorKey
    last: Int
    before: CursorKey
    orderBy: ProfileOrder
    filter: ProfileFilter
  ): ProfileConnection @goField(forceResolver: true)

  sessions(
    first: Int
    after: CursorKey
    last: Int
    before: CursorKey
    orderBy: SessionOrder
  ): SessionConnection @goField(forceResolver: true)

  personalAPIKeys(
    first: Int
    after: CursorKey
    last: Int
    before: CursorKey
  ): PersonalAPIKeyConnection
    @goField(forceResolver: true)
    @authentication(required: PRESENT)
    @sessionOnly

  oauth2AccessTokens(
    first: Int
    after: CursorKey
    last: Int
    before: CursorKey
  ): OAuth2AccessTokenConnection
    @goField(forceResolver: true)
    @authentication(required: PRESENT)
    @sessionOnly

  invitingOrganizations: [Organization!]!
    @goField(forceResolver: true)
    @authentication(required: PRESENT)
    @sessionOnly

  ssoLoginURL: String
    @goField(forceResolver: true)
    @authentication(required: PRESENT)
    @sessionOnly

  permission(action: String!): Boolean!
    @goField(forceResolver: true)
    @authentication(required: PRESENT)
}

extend type Mutation {
  updateAvatar(
    input: UpdateAvatarInput!
  ): UpdateAvatarPayload @authentication(required: PRESENT) @sessionOnly
  deleteAvatar: DeleteAvatarPayload
    @authentication(required: PRESENT)
    @sessionOnly
}

input UpdateAvatarInput {
  file: Upload!
}

type UpdateAvatarPayload {
  identity: Identity!
}

type DeleteAvatarPayload {
  identity: Identity!
}
