enum EmployeePortalOrderField
    @goModel(
        model: "go.probo.inc/probo/pkg/coredata.EmployeePortalOrderField"
    ) {
    CREATED_AT
        @goEnum(
            value: "go.probo.inc/probo/pkg/coredata.EmployeePortalOrderFieldCreatedAt"
        )
}

input EmployeePortalOrder
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/connect/v1/types.EmployeePortalOrderBy"
    ) {
    direction: OrderDirection!
    field: EmployeePortalOrderField!
}

type EmployeePortalCapabilities
    @goModel(
        model: "go.probo.inc/probo/pkg/coredata.EmployeePortalCapabilities"
    ) {
    deviceAgent: Boolean!
}

type EmployeePortal implements Node {
    id: ID!
    name: String!
    capabilities: EmployeePortalCapabilities!
    organization: Organization! @goField(forceResolver: true)
}

type EmployeePortalConnection
    @goModel(
        model: "go.probo.inc/probo/pkg/server/api/connect/v1/types.EmployeePortalConnection"
    ) {
    totalCount: Int! @goField(forceResolver: true)
    edges: [EmployeePortalEdge!]!
    pageInfo: PageInfo!
}

type EmployeePortalEdge {
    cursor: CursorKey!
    node: EmployeePortal!
}
